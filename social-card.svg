<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title description">
  <title id="title">Aeronautical Map Master</title>
  <desc id="description">An original aviation chart-inspired study deck social card with a glowing runway, route line, and chart grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".58" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#11102b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".45" r=".58">
      <stop offset="0" stop-color="#0e7490" stop-opacity=".38"/>
      <stop offset=".54" stop-color="#164e63" stop-opacity=".12"/>
      <stop offset="1" stop-color="#08111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="runway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283c"/>
      <stop offset="1" stop-color="#0d1b2c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity=".08" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#67e8f9" fill-opacity=".2"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#background)"/>
  <rect width="1200" height="627" fill="url(#glow)"/>
  <rect width="1200" height="627" fill="url(#grid)"/>
  <path d="M0 496C224 436 351 541 556 489s400-117 644-35v173H0z" fill="#08111f" fill-opacity=".62"/>
  <path d="M0 496C224 436 351 541 556 489s400-117 644-35" fill="none" stroke="#22d3ee" stroke-opacity=".12" stroke-width="2"/>

  <g transform="translate(72 70)">
    <rect width="47" height="47" rx="14" fill="#083344" stroke="#22d3ee" stroke-opacity=".7"/>
    <path d="M23.5 8v31M8 23.5h31M12.5 12.5l22 22m0-22-22 22" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-opacity=".65"/>
    <circle cx="23.5" cy="23.5" r="9" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
    <circle cx="23.5" cy="23.5" r="2.8" fill="#f0fdfa"/>
    <path d="m23.5 13 3 10.5-3 3-3-3z" fill="#22d3ee"/>
  </g>
  <text x="135" y="91" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">AERONAUTICAL SYMBOL STUDY DECK</text>

  <text x="72" y="222" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Aeronautical</text>
  <text x="72" y="294" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Map <tspan fill="#67e8f9">Master</tspan></text>
  <text x="76" y="338" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Learn the language of the sky.</text>
  <text x="76" y="372" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="15">Explore. Practice. Review.</text>

  <g transform="translate(72 414)">
    <rect width="174" height="68" rx="12" fill="#0b1d30" stroke="#164e63"/>
    <text x="18" y="34" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">125</text>
    <text x="18" y="54" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.3">CHART SYMBOLS</text>
  </g>
  <g transform="translate(260 414)">
    <rect width="205" height="68" rx="12" fill="#0b1d30" stroke="#164e63"/>
    <text x="18" y="34" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">25</text>
    <text x="18" y="54" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.1">AIRPORT FEATURES</text>
  </g>

  <g transform="translate(76 535)">
    <circle cx="7" cy="0" r="5" fill="#fbbf24"/>
    <text x="22" y="5" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">STUDY AID ONLY · NOT FOR OPERATIONAL USE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="719" y="69" width="407" height="487" rx="28" fill="#07111f" fill-opacity=".75" stroke="#155e75" stroke-opacity=".8"/>
    <rect x="735" y="85" width="375" height="455" rx="20" fill="#0b1828" stroke="#1e3a50"/>
  </g>
  <g opacity=".68" fill="none" stroke="#155e75">
    <path d="M755 153c84-47 146-42 215-3s93 42 122 22"/>
    <path d="M755 168c84-47 146-42 215-3s93 42 122 22"/>
    <path d="M757 454c70-44 133-40 196-5s110 47 142 30"/>
    <path d="M757 469c70-44 133-40 196-5s110 47 142 30"/>
    <circle cx="1018" cy="201" r="92" stroke-opacity=".48"/>
    <circle cx="1018" cy="201" r="65" stroke-opacity=".38"/>
    <circle cx="1018" cy="201" r="38" stroke-opacity=".28"/>
  </g>
  <g transform="rotate(-17 926 322)">
    <rect x="855" y="156" width="142" height="340" rx="14" fill="url(#runway)" stroke="#66839b" stroke-opacity=".55" stroke-width="2"/>
    <path d="M871 176v300M981 176v300" stroke="#cbd5e1" stroke-opacity=".68" stroke-width="3"/>
    <path d="M926 190v28m0 22v28m0 22v28m0 22v28m0 22v28m0 22v28m0 22v20" stroke="#e2e8f0" stroke-opacity=".9" stroke-width="4" stroke-linecap="round"/>
    <path d="M886 213h-9m100 0h-9M886 439h-9m100 0h-9" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <rect x="893" y="177" width="67" height="14" rx="4" fill="#cbd5e1" fill-opacity=".72"/>
    <rect x="893" y="481" width="67" height="7" rx="3.5" fill="#fbbf24" fill-opacity=".9"/>
  </g>

  <path d="M769 401C814 365 820 293 866 271s75 35 128 8 71-71 122-71" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="13" filter="url(#softGlow)"/>
  <path d="M769 401C814 365 820 293 866 271s75 35 128 8 71-71 122-71" fill="none" stroke="url(#route)" stroke-width="3.5" stroke-dasharray="2 12" stroke-linecap="round"/>
  <g filter="url(#softGlow)">
    <circle cx="769" cy="401" r="7" fill="#a5f3fc"/>
    <circle cx="866" cy="271" r="6" fill="#a5f3fc"/>
    <circle cx="994" cy="279" r="6" fill="#a5f3fc"/>
    <circle cx="1116" cy="208" r="8" fill="#fbbf24"/>
  </g>
  <g transform="translate(1043 104)">
    <path d="M0 27 9 0l9 27-9-5z" fill="#f8fafc"/>
    <text x="9" y="47" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">N</text>
  </g>
  <text x="754" y="521" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.7">LEARN THE MARKS · RESPECT THE SOURCE</text>
</svg>
